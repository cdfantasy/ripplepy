# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/Library/Application Support/reasonix/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

config_version = 2
default_model = "deepseek-flash"
# language      = "zh"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG

[agent]
cold_resume_prune = true

[[providers]]
name        = "deepseek-flash"
kind        = "openai"
base_url    = "https://api.deepseek.com"
model       = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"
context_window = 1000000
price       = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }
prices      = { "deepseek-v4-flash" = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" } }

[[providers]]
name        = "deepseek-pro"
kind        = "openai"
base_url    = "https://api.deepseek.com"
model       = "deepseek-v4-pro"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"
context_window = 1000000
price       = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" }
prices      = { "deepseek-v4-pro" = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" } }

[[providers]]
name        = "mimo-pro"
kind        = "openai"
base_url    = "https://token-plan-cn.xiaomimimo.com/v1"
models      = ["mimo-v2.5-pro", "mimo-v2.5"]
default     = "mimo-v2.5-pro"
api_key_env = "MIMO_API_KEY"
context_window = 1000000
price       = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" }
prices      = { "mimo-v2.5" = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }, "mimo-v2.5-pro" = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" } }
vision_models = ["mimo-v2.5"]
no_proxy    = true

[[providers]]
name        = "mimo-flash"
kind        = "openai"
base_url    = "https://token-plan-cn.xiaomimimo.com/v1"
models      = ["mimo-v2.5-pro", "mimo-v2.5"]
default     = "mimo-v2.5"
api_key_env = "MIMO_API_KEY"
context_window = 1000000
price       = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }
prices      = { "mimo-v2.5" = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }, "mimo-v2.5-pro" = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" } }
vision_models = ["mimo-v2.5"]
no_proxy    = true
[tools]
bash_timeout_seconds = 120

[codegraph]
enabled      = true   # built-in MCP server; off by default for first-run sessions
auto_install = true   # fetch the runtime when CodeGraph is enabled but missing
# path       = ""   # empty = cache, then PATH, then a bundle beside reasonix

[builtin_mcp]
time_enabled = true   # built-in Time MCP; off until manually enabled
context7_enabled = false   # built-in Context7 MCP; off until manually enabled

[lsp]
enabled = true   # language server tools; servers launch lazily when used
# [lsp.servers.go]
# command = "gopls"
# args = []
# extensions = [".go"]

[skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra custom skill roots
# excluded_paths = ["~/.agents/skills"]   # hide convention roots without deleting folders
# max_depth = 3   # nested scan depth; set 1 for legacy root-only discovery
# disabled_skills = ["review"]   # hide noisy or unwanted skills

[permissions]
allow = ["Bash(find /Users/zkgao -maxdepth 4 -name \"zotero\" -type d 2>/dev/null | head -10)", "Bash(find /Users/zkgao -maxdepth 5 -name \"Zotero\" -type d 2>/dev/null | head -10)", "Bash(ls /Users/zkgao/OneDrive* 2>/dev/null || ls /Users/zkgao/Library/CloudStorage/ 2>/dev/null || echo \"no OneDrive found\")", "Bash(curl -s http://127.0.0.1:23120/mcp 2>&1 | head -20)", "mcp__zotero-local-mcp__search_library", "Bash(conda run -n simsopt python -c \"\nimport numpy as np, time\nfrom simsopt.mhd import Boozer, Vmec\nfrom ripplepy.boozer_eps_verify import _boozer_obj_to_dict, sample_fieldline_from_boozer\n\nprint('Loading VMEC...'); t0=time.time()\nvmec = Vmec('/Users/zkgao/ripplepy/tests/test_file/wout_cfqs_test_m10_n5_fixed.nc')\nprint(f'  {time.time()-t0:.1f}s')\nprint('Running Boozer...'); t0=time.time()\nboozer = Boozer(vmec); boozer.mpol=72; boozer.ntor=36\nboozer.register([0.46]); boozer.run()\nbd = _boozer_obj_to_dict(boozer)\nprint(f'  {time.time()-t0:.1f}s')\nprint('Sampling field line...'); t0=time.time()\nfl = sample_fieldline_from_boozer(bd, 0, None, 360, 5)\nprint(f'  {time.time()-t0:.1f}s, npts={len(fl.B)}')\n\nB=fl.B; kg=fl.kg_gradpsi; gp=fl.gradpsi\nnpts=len(B); dphi=2*np.pi/360; dm=np.full(npts,dphi)\nb0=np.max(B); bmin=np.min(B)\nnpart=10\neta_vals = bmin/b0 + (1-bmin/b0)/(npart-1)*(np.arange(npart)+0.5)\n\n# OLD\nbigint=0.0; t0=time.time()\nfor eta in eta_vals:\n    isw=0; iswst=0; Ha=0.0; Ia=0.0\n    for k in range(npts):\n        bl=B[k]/b0; sq=1.0-bl/eta\n        if sq>0:\n            isw=1; se=np.sqrt(eta-bl); ib2=1.0/B[k]**2\n            Ha+=se*ib2*(4.0/bl-1.0/eta)*kg[k]/eta*dm[k]\n            Ia+=se*ib2/np.sqrt(eta)*dm[k]\n        else:\n            if isw==1: isw=2\n        if isw==2:\n            if Ia>1e-15: bigint+=Ha*Ha/Ia*iswst\n            iswst=1; Ha=0.0; Ia=0.0\ne2=np.sum(dm/B**2); e3=np.sum(dm*gp/B**2)\nold = np.pi*1.0*(1-bmin/b0)/(npart-1)/(8*np.sqrt(2))*bigint*e2/e3**2\nt1=time.time(); print(f'Old: {old:.6e}  ({t1-t0:.2f}s)')\n\n# NEW\nb_loc=B/b0; inv_B2=1.0/B**2; kg_pre=kg\nbigint=0.0; t0=time.time()\nfor eta in eta_vals:\n    trapped=b_loc<eta\n    edges=np.diff(trapped.astype(np.int8))\n    ws=np.where(edges==1)[0]+1; we=np.where(edges==-1)[0]+1\n    if trapped[0]: ws=np.concatenate([[0],ws])\n    if trapped[-1]: we=np.concatenate([we,[npts]])\n    for j in range(len(ws)):\n        w0,w1=ws[j],we[j]\n        if w1-w0<2: continue\n        s=slice(w0,w1); bs=b_loc[s]; ks=kg_pre[s]; ibs=inv_B2[s]\n        se=np.sqrt(eta-bs); cm=se*ibs\n        Iw=np.sum(cm)/np.sqrt(eta)*dphi\n        Hw=np.sum(cm*(4.0/bs-1.0/eta)*ks)/eta*dphi\n        if Iw>1e-15 and j>0: bigint+=Hw*Hw/Iw\nnew = np.pi*1.0*(1-bmin/b0)/(npart-1)/(8*np.sqrt(2))*bigint*e2/e3**2\nt1=time.time(); print(f'New: {new:.6e}  ({t1-t0:.2f}s)')\nprint(f'relative diff: {abs(old-new)/max(abs(old),1e-30):.2e}')\n\" 2>&1)", "task", "Bash(find /Users/zkgao/ripplepy -name \"*.f90\" -o -name \"*.f\" -o -name \"*.F90\" | xargs grep -l \"r8akherm3p\\|r8herm3ev\" 2>/dev/null)", "Edit", "Bash(cd /Users/zkgao/ripplepy && python -c \"\nimport ast\nwith open('tests/h1_optimise.py') as f:\n    ast.parse(f.read())\nprint('✓ Syntax OK')\n\n# Read and check guard\nsrc = open('tests/h1_optimise.py').read()\nassert 'if __name__ == \\\"__main__\\\":' in src\nassert 'def main():' in src\nassert 'main()' in src\nprint('✓ if __name__ guard and main() function present')\nprint('✓ No unprotected top-level execution code (all logic in main())')\n\")"]
[sandbox]
# Confine tool blast radius. File-writers (write_file/edit_file/multi_edit/move_file)
# may only write under workspace_root (empty = current dir) + allow_write.
# bash = "enforce" (default) jails each command in an OS sandbox (macOS now;
# graceful fallback elsewhere); "off" disables it. network allows egress.
# workspace_root = ""            # default: current working directory
# allow_write = ["/tmp"]          # extra dirs writers may also modify
bash    = "enforce"
network = true

[statusline]
# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow","cwd"} as JSON on stdin.
# command = "my-statusline.sh"

# External MCP servers. type: "stdio" (default, a subprocess) | "http" | "sse".
# ${VAR} / ${VAR:-default} are expanded from the environment in command/args/env/url/headers.
# [[plugins]]
# name    = "example"
# command = "reasonix-plugin-example"
# [[plugins]]                                  # a remote server over Streamable HTTP
# name    = "stripe"
# type    = "http"
# url     = "https://mcp.stripe.com"
# headers = { Authorization = "Bearer ${STRIPE_KEY}" }
